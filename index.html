<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Comic Book Hub</title>
  <meta name="description" content="Educational comics capturing the magic of classic cartoons. Discover fascinating everyday concepts explained through the familiar, fun style of classic childhood cartoons."/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=DM+Serif+Display:ital@0;1&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="preload" as="image" href="assets/user-home-theme.webp"/>
  <link rel="preload" as="image" href="assets/covers/title_page.webp"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --sky-bg:    #eaf4fc;
      --sky-card:  #ffffff;
      --ink-dark:  #142436;
      --ink-body:  #3b4e61;
      --ink-muted: #6b8299;
      --teal-cta:  #2f7a85;
      --teal-hover:#235e67;
      --border-subtle: rgba(47,122,133,0.18);
      --shadow-sm: 0 4px 16px rgba(30,70,105,0.08);
      --shadow-md: 0 12px 32px rgba(30,70,105,0.14);
      --radius:    14px;
      --t:         0.22s ease;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--sky-bg);
      color: var(--ink-dark);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ─── NAV ─── */
    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      height: 64px;
      display: flex; align-items: center; justify-content: flex-start;
      padding: 0 44px;
      background: rgba(236, 244, 253, 0.9);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border-subtle);
    }
    .nav-brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      transition: transform 0.2s ease;
      color: var(--ink-dark);
    }
    .nav-brand:hover {
      transform: translateY(-1px);
    }
    .nav-brand-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      border: 1.5px solid var(--ink-dark);
      border-radius: 4px;
      color: var(--ink-dark);
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      background: transparent;
      box-shadow: none;
    }
    .nav-brand-text {
      font-family: 'Inter', sans-serif;
      font-size: 1.15rem;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: var(--ink-dark);
      background: none;
      -webkit-background-clip: unset;
      -webkit-text-fill-color: unset;
      background-clip: unset;
      text-shadow: none;
    }

    /* ─── HERO SECTION ─── */
    .hero {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      overflow: hidden;
      padding: 100px 24px 60px;
      background-color: #ebf5fd;
    }

    /* Full background illustration - covers area beautifully without excessive empty top/bottom space */
    .hero-bg {
      position: absolute;
      inset: 0;
      background-image: url('assets/user-home-theme.webp');
      background-size: cover;
      background-position: center center;
      background-repeat: no-repeat;
      z-index: 1;
      opacity: 0.92;
    }

    /* Center text card container */
    .hero-inner {
      position: relative;
      z-index: 3;
      max-width: 680px;
      width: 100%;
      margin: 20px auto;
      padding: 44px 34px;
      background: rgba(235, 245, 253, 0.88);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.85);
      box-shadow: 0 10px 40px rgba(25, 65, 105, 0.08);
    }

    .hero-eyebrow {
      display: inline-block;
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--teal-cta);
      margin-bottom: 20px;
    }

    .hero-title {
      font-family: 'DM Serif Display', serif;
      font-size: clamp(2.4rem, 5.2vw, 3.8rem);
      line-height: 1.16;
      color: var(--ink-dark);
      margin-bottom: 22px;
      letter-spacing: -0.01em;
    }

    .hero-title em {
      font-style: italic;
      color: var(--teal-cta);
    }

    .hero-themes {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--teal-cta);
      letter-spacing: 0.02em;
      margin: 0 auto 32px;
      max-width: 600px;
      line-height: 1.5;
    }

    .hero-cta-btn {
      display: inline-block;
      font-size: 0.92rem;
      font-weight: 600;
      color: #ffffff;
      background: var(--teal-cta);
      border: none;
      border-radius: 10px;
      padding: 15px 42px;
      cursor: pointer;
      text-decoration: none;
      transition: var(--t);
      box-shadow: 0 4px 18px rgba(47,122,133,0.3);
      letter-spacing: 0.02em;
    }
    .hero-cta-btn:hover {
      background: var(--teal-hover);
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(47,122,133,0.4);
    }

    /* ─── LIBRARY SECTION ─── */
    .library {
      max-width: 1100px;
      margin: 0 auto;
      padding: 80px 28px 120px;
      position: relative;
      z-index: 2;
    }

    .library-header {
      margin-bottom: 40px;
      text-align: left;
    }

    .library-title {
      font-family: 'DM Serif Display', serif;
      font-size: 1.85rem;
      color: var(--ink-dark);
      letter-spacing: -0.01em;
    }

    /* ─── COMIC GRID & CARDS ─── */
    .comics-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(min(100%, 260px), 300px));
      gap: 28px;
    }

    .comic-card {
      background: var(--sky-card);
      border-radius: var(--radius);
      overflow: hidden;
      cursor: pointer;
      border: 1.5px solid transparent;
      box-shadow: var(--shadow-sm);
      transition: var(--t);
    }
    .comic-card:hover {
      border-color: var(--teal-cta);
      transform: translateY(-6px);
      box-shadow: var(--shadow-md);
    }

    /* Natural A4 Cover display using the genuine Title Page */
    .comic-cover {
      position: relative;
      aspect-ratio: 1 / 1.414; /* Exact A4 aspect ratio */
      overflow: hidden;
      background: #e2eef8;
    }

    .comic-cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.35s ease;
    }
    .comic-card:hover .comic-cover img {
      transform: scale(1.03);
    }

    .read-overlay {
      position: absolute;
      inset: 0;
      background: rgba(20, 48, 64, 0.72);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: var(--t);
    }
    .comic-card:hover .read-overlay {
      opacity: 1;
    }

    .read-label {
      font-size: 0.85rem;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      border: 1.5px solid rgba(255,255,255,0.8);
      padding: 9px 24px;
      border-radius: 6px;
      background: rgba(0,0,0,0.2);
    }

    .comic-info {
      padding: 16px 18px;
    }
    .comic-tag {
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--teal-cta);
      margin-bottom: 6px;
    }
    .comic-name {
      font-family: 'DM Serif Display', serif;
      font-size: 1.15rem;
      color: var(--ink-dark);
      line-height: 1.3;
      margin-bottom: 6px;
    }
    .comic-desc {
      font-size: 0.82rem;
      color: var(--ink-body);
      line-height: 1.55;
    }

    /* ─── FOOTER ─── */
    footer {
      text-align: center;
      padding: 32px 24px;
      border-top: 1px solid var(--border-subtle);
      color: var(--ink-muted);
      font-size: 0.82rem;
      line-height: 1.7;
      background: rgba(234, 244, 252, 0.6);
    }
    footer a { color: var(--teal-cta); text-decoration: none; font-weight: 500; }
    footer a:hover { text-decoration: underline; }

    /* ─── PDF READER MODAL ─── */
    .modal-backdrop {
      position: fixed; inset: 0;
      background: rgba(10, 24, 38, 0.78);
      z-index: 1000;
      display: flex; align-items: center; justify-content: center;
      opacity: 0; pointer-events: none;
      transition: opacity 0.22s ease;
      backdrop-filter: blur(8px);
    }
    .modal-backdrop.open { opacity: 1; pointer-events: all; }

    .modal {
      width: 96vw; height: 96vh; max-width: 1160px;
      background: #ffffff;
      border-radius: 16px;
      display: flex; flex-direction: column;
      overflow: hidden;
      box-shadow: 0 32px 80px rgba(0,0,0,0.3);
      transform: scale(0.97);
      transition: transform 0.22s ease;
    }
    .modal-backdrop.open .modal { transform: scale(1); }

    .modal-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 24px;
      border-bottom: 1px solid #e1ecf5;
      background: #f4f9fd;
      flex-shrink: 0;
    }
    .modal-title {
      font-family: 'DM Serif Display', serif;
      font-size: 1.05rem;
      color: var(--ink-dark);
    }
    .modal-btns { display: flex; gap: 8px; }
    .mbtn {
      width: 34px; height: 34px; border-radius: 8px;
      border: 1px solid #c9dceb; background: #ffffff;
      color: var(--ink-body); cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.95rem; transition: var(--t);
    }
    .mbtn:hover { border-color: var(--teal-cta); color: var(--teal-cta); background: #eaf4fb; }
    .mbtn.x:hover { border-color: #ef4444; color: #ef4444; background: #fef2f2; }

    .modal-body {
      flex: 1; overflow: hidden;
      display: flex; min-height: 0;
    }

    /* Viewer: natural scrolling, aspect ratio preserved */
    .viewer {
      flex: 1; overflow: auto;
      background: #e5eef6;
      display: flex; align-items: flex-start; justify-content: center;
      padding: 24px; min-width: 0;
    }
    .viewer::-webkit-scrollbar { width: 6px; height: 6px; }
    .viewer::-webkit-scrollbar-thumb { background: #9bb8cf; border-radius: 3px; }

    #page-canvas {
      display: block; flex-shrink: 0;
      box-shadow: 0 4px 28px rgba(15,35,55,0.22);
      border-radius: 2px;
    }

    /* Thumbnail sidebar: full A4 ratio, comfortable scrolling */
    .thumb-sidebar {
      width: 124px; flex-shrink: 0;
      border-left: 1px solid #e1ecf5;
      background: #ffffff;
      overflow-y: auto; overflow-x: hidden;
      padding: 12px 8px;
      display: flex; flex-direction: column; gap: 8px;
    }
    .thumb-sidebar::-webkit-scrollbar { width: 4px; }
    .thumb-sidebar::-webkit-scrollbar-thumb { background: #9bb8cf; border-radius: 2px; }
    .thumb-lbl {
      font-size: 0.65rem; font-weight: 700;
      letter-spacing: 0.12em; text-transform: uppercase;
      color: var(--ink-muted); padding-bottom: 4px; flex-shrink: 0;
    }
    .thumb {
      cursor: pointer; border-radius: 5px; overflow: hidden;
      border: 2px solid transparent; transition: var(--t);
      position: relative; background: #eaf4fb; flex-shrink: 0;
    }
    .thumb:hover { border-color: #72b2c9; }
    .thumb.active { border-color: var(--teal-cta); }
    .thumb canvas { display: block; width: 100%; height: auto; }
    .thumb-n {
      position: absolute; bottom: 0; left: 0; right: 0;
      text-align: center; font-size: 0.6rem; font-weight: 600;
      background: rgba(255,255,255,0.92); color: var(--ink-dark); padding: 2px 0;
    }

    /* Loading state */
    .loading {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 14px; color: var(--ink-muted);
      font-size: 0.85rem; min-height: 300px; width: 100%;
    }
    .spinner {
      width: 36px; height: 36px;
      border: 3px solid #c9dceb;
      border-top-color: var(--teal-cta);
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
    }
    .prog-wrap { width: 190px; height: 4px; background: #c9dceb; border-radius: 2px; overflow: hidden; }
    .prog-bar  { height: 100%; width: 0%; background: var(--teal-cta); border-radius: 2px; transition: width 0.3s ease; }

    /* Reader bottom toolbar */
    .pdf-bar {
      display: flex; align-items: center; justify-content: center;
      gap: 10px; padding: 12px 24px;
      border-top: 1px solid #e1ecf5;
      background: #f4f9fd; flex-shrink: 0; flex-wrap: wrap;
    }
    .pb-arrow {
      width: 34px; height: 34px; border-radius: 8px;
      border: 1px solid #c9dceb; background: #ffffff;
      color: var(--ink-body); cursor: pointer; font-size: 1.15rem;
      display: flex; align-items: center; justify-content: center; transition: var(--t);
    }
    .pb-arrow:hover:not(:disabled) { border-color: var(--teal-cta); color: var(--teal-cta); }
    .pb-arrow:disabled { opacity: 0.3; cursor: not-allowed; }
    .pb-info { font-size: 0.82rem; color: var(--ink-muted); display: flex; align-items: center; gap: 6px; }
    .pb-input {
      width: 44px; padding: 5px 4px;
      border: 1px solid #c9dceb; border-radius: 6px;
      text-align: center; font-size: 0.82rem;
      font-family: inherit; color: var(--ink-dark); background: #ffffff; outline: none;
    }
    .pb-input:focus { border-color: var(--teal-cta); }
    .pb-sep { width: 1px; height: 22px; background: #c9dceb; }
    .pb-zbtn {
      width: 30px; height: 30px; border-radius: 6px;
      border: 1px solid #c9dceb; background: #ffffff;
      color: var(--ink-body); cursor: pointer; font-size: 1rem;
      display: flex; align-items: center; justify-content: center; transition: var(--t);
    }
    .pb-zbtn:hover { border-color: var(--teal-cta); color: var(--teal-cta); }
    /* Hide browser default number spinners (arrows) */
    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    input[type=number] {
      -moz-appearance: textfield;
    }

    .pb-zoom-wrap {
      display: inline-flex;
      align-items: center;
      position: relative;
    }
    .pb-zoom-input {
      width: 52px;
      padding: 5px 16px 5px 6px;
      border: 1px solid #c9dceb;
      border-radius: 6px;
      text-align: center;
      font-size: 0.82rem;
      font-family: inherit;
      color: var(--ink-dark);
      background: #ffffff;
      outline: none;
      transition: var(--t);
    }
    .pb-zoom-input:focus { border-color: var(--teal-cta); }
    .pb-zoom-pct {
      position: absolute;
      right: 6px;
      font-size: 0.75rem;
      color: var(--ink-muted);
      pointer-events: none;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* Tablet devices (iPad, Surface Pro, tablets) */
    @media (max-width: 1024px) {
      .hero {
        padding: 90px 20px 50px;
      }
      .hero-inner {
        max-width: 620px;
        padding: 38px 28px;
      }
    }

    /* Mobile screens */
    @media (max-width: 768px) {
      nav { padding: 0 20px; }
      .hero {
        padding: 85px 16px 45px;
      }
      .hero-bg {
        background-size: cover;
        opacity: 0.45;
      }
      .hero-inner {
        padding: 28px 18px;
        margin: 0 auto;
        background: rgba(235, 245, 253, 0.94);
      }
      .hero-eyebrow { font-size: 1.25rem; margin-bottom: 12px; }
      .hero-title { font-size: 2.1rem; margin-bottom: 16px; }
      .hero-themes { font-size: 0.88rem; margin-bottom: 24px; }
      .thumb-sidebar { display: none; }
    }
  </style>
</head>
<body>

  <!-- NAV -->
  <nav>
    <a href="#" class="nav-brand" title="Comic Book Hub">
      <span class="nav-brand-badge">CBH</span>
      <span class="nav-brand-text">Comic Book Hub</span>
    </a>
  </nav>

  <!-- HERO -->
  <section class="hero" id="home">
    <div class="hero-bg"></div>
    <div class="hero-inner">
      <span class="hero-eyebrow">WELCOME</span>
      <h1 class="hero-title">
        Where everyday concepts<br/>meet <em>fun storytelling</em>
      </h1>
      <div class="hero-themes">Themes: AI, Climate Change, Energy Transition, Science & Human Behaviour</div>
      <a href="#library" class="hero-cta-btn" id="hero-lib">Browse the Library</a>
    </div>
  </section>

  <!-- LIBRARY -->
  <section class="library" id="library">
    <div class="library-header">
      <h2 class="library-title">The Library</h2>
    </div>
    <div class="comics-grid" id="comics-grid"></div>
  </section>

  <!-- FOOTER -->
  <footer>
    <p>Comic Book Hub &nbsp;&middot;&nbsp; Hosted on <a href="https://github.com/pranay-code/ComicBookHub" target="_blank">GitHub Pages</a></p>
  </footer>

  <!-- PDF MODAL -->
  <div class="modal-backdrop" id="modal-backdrop" onclick="closeOnBackdrop(event)">
    <div class="modal">
      <div class="modal-header">
        <span class="modal-title" id="modal-title">—</span>
        <div class="modal-btns">
          <button class="mbtn" onclick="downloadComic()" title="Download PDF">&#8595;</button>
          <button class="mbtn x" onclick="closeModal()" title="Close">&#x2715;</button>
        </div>
      </div>
      <div class="modal-body">
        <div class="viewer" id="viewer">
          <div class="loading">
            <div class="spinner"></div>
            <span id="load-status">Opening…</span>
            <div class="prog-wrap"><div class="prog-bar" id="prog-bar"></div></div>
          </div>
        </div>
        <div class="thumb-sidebar" id="thumb-sidebar">
          <div class="thumb-lbl">Pages</div>
        </div>
      </div>
      <div class="pdf-bar">
        <button class="pb-arrow" id="btn-prev" onclick="changePage(-1)">&#8249;</button>
